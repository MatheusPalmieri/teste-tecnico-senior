name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_test
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: hotel_test
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CACHE_ENABLED: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AUTH_COOKIE_SECURE: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Instalar dependencias
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: backend
        run: ruff check . && ruff format --check .
      - name: Tipos (mypy)
        working-directory: backend
        run: mypy .
      - name: Migrations pendentes
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - name: Testes (ordem aleatória, cobertura 100% de linhas e branches)
        working-directory: backend
        run: pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint && npm run format:check
      - name: Tipos
        working-directory: frontend
        run: npm run typecheck
      - name: Testes (ordem aleatória, gates de cobertura em vite.config.ts)
        working-directory: frontend
        run: npm run test -- --coverage
      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hotel_e2e
          POSTGRES_USER: hotel
          POSTGRES_PASSWORD: hotel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hotel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      POSTGRES_DB: hotel_e2e
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CACHE_ENABLED: "True"
      AUTH_COOKIE_SECURE: "False"
      E2E_BASE_URL: http://localhost:4173
      E2E_API_URL: http://localhost:8000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias do backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Migrar (E2E_MODE)
        working-directory: backend
        run: python manage.py migrate --settings=config.settings.e2e
      - name: Subir backend (E2E_MODE)
        working-directory: backend
        run: nohup python manage.py runserver 0.0.0.0:8000 --noreload --settings=config.settings.e2e &
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Instalar dependencias do frontend (para o `npm run preview`)
        working-directory: frontend
        run: npm ci
      - name: Instalar dependencias do E2E
        working-directory: e2e
        run: npm ci
      - name: Tipos do E2E
        working-directory: e2e
        run: npx tsc --noEmit
      - name: Instalar navegadores do Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox
      - name: Rodar Playwright
        working-directory: e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
