<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hotel</title>
    <style>
      #app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        z-index: 9999;
      }

      #app-loading h1 {
        margin: 0;
        color: #0f172a;
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #app-loading .progress-track {
        width: 220px;
        height: 4px;
        border-radius: 999px;
        background: #e2e8f0;
        overflow: hidden;
      }

      #app-loading .progress-bar {
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: #008267;
        animation: app-loading-slide 1.1s ease-in-out infinite;
      }

      @keyframes app-loading-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loading">
        <h1>Hotel</h1>
        <div class="progress-track">
          <div class="progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
